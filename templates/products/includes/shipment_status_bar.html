{% load i18n %}

{% block style %}
<style>
    /* Стили для шкалы прогресса */
    #delivery-progress {
        position: relative;
        width: 100%;
        height: 20px;
        margin-top: 10px;
        background-color: #eee;
        border-radius: 10px;
        overflow: hidden;
    }

    #delivery-progress .progress-bar {
        height: 100%;
        background-color: #4caf50;
        width: 0;
        transition: width 0.5s ease;
    }

    /* Контейнер для меток этапов */
    .step-labels {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        font-size: 14px;
        color: #666;
    }

    /* Стили для каждого этапа */
    .step-labels .step {
        text-align: center;
        flex: 1;
        padding: 0 5px;
        color: #ccc; /* Цвет для неактивных этапов */
    }

    /* Пройденные этапы */
    .step-labels .step.passed {
        color: #fff; /* Белый цвет для пройденных этапов */
    }

    /* Текущий этап */
    .step-labels .step.active {
        color: #4caf50; /* Зеленый цвет для текущего этапа */
        font-weight: bold;
    }
</style>
{% endblock %}


<div class="mt-4">
    <h5>Delivery Progress</h5>
    <div id="delivery-progress">
        <div class="progress-bar"></div>
    </div>
    <div class="step-labels">
        <div class="step" data-status="In assembly">In Assembly</div>
        <div class="step" data-status="In delivery">In Delivery</div>
        <div class="step" data-status="Being unloaded">Being Unloaded</div>
        <div class="step" data-status="Under review">Under Review</div>
        <div class="step" data-status="Accepted">Accepted</div>
    </div>
</div>

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const status = "{{ shipment.status }}"; // Получаем статус поставки
        const steps = document.querySelectorAll('.step-labels .step');
        const progressBar = document.querySelector('#delivery-progress .progress-bar');

        // Определяем прогресс в зависимости от статуса
        let progress = 0;
        switch (status) {
            case 'In assembly':
                progress = 20;
                break;
            case 'In delivery':
                progress = 40;
                break;
            case 'Being unloaded':
                progress = 60;
                break;
            case 'Under review':
                progress = 80;
                break;
            case 'Accepted':
                progress = 100;
                break;
            default:
                progress = 0;
        }

        // Устанавливаем ширину прогресс-бара
        progressBar.style.width = `${progress}%`;

        // Активируем соответствующие шаги
        let isCurrentStatusFound = false;
        steps.forEach(step => {
            if (step.getAttribute('data-status') === status) {
                step.classList.add('active');
                isCurrentStatusFound = true;
            } else if (!isCurrentStatusFound) {
                step.classList.add('passed'); // Пройденные этапы
            }
        });
    });
</script>
{% endblock %}
