{% load crispy_forms_tags %}

<div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content bg-dark text-light">
            <div class="modal-header bg-dark border-secondary">
                <h5 class="modal-title" id="categoryModalLabel">Manage categories</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form method="post" action="{% url 'products:create_category' %}" class="mb-3">
                    {% csrf_token %}
                    <div class="input-group">
                        {{ category_form.name|as_crispy_field }}
                        <button type="submit" class="btn btn-success form-control h-25" style="max-width: 20%;">
                            <i class="bi bi-plus-circle"></i> Create
                        </button>
                    </div>
                </form>
                <div class="row">
                    {% for category in categories %}
                    <div class="col-md-4 mb-3">
                        <div class="card bg-secondary text-light">
                            <div class="card-body">
                                <h5 class="card-title" id="category-title-{{ category.id }}">{{ category.name }}</h5>
                                <form method="post" action="{% url 'products:update_category' category.id %}" class="d-none" id="category-edit-form-{{ category.id }}">
                                    {% csrf_token %}
                                    <div class="input-group mb-2">
                                        <input type="text" name="name" class="form-control" value="{{ category.name }}" required>
                                        <button type="submit" class="btn btn-primary btn-sm">
                                            <i class="bi bi-check"></i>
                                        </button>
                                    </div>
                                </form>
                                <div class="d-flex justify-content-end">
                                    <button type="button" class="btn btn-primary btn-sm me-2" onclick="toggleEdit('{{ category.id }}')">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button type="button" class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#deleteCategoryModal{{ category.id }}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="modal fade" id="deleteCategoryModal{{ category.id }}" tabindex="-1" aria-labelledby="deleteCategoryModalLabel{{ category.id }}" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content bg-dark text-light">
                                <div class="modal-header bg-dark border-secondary">
                                    <h5 class="modal-title" id="deleteCategoryModalLabel{{ category.id }}">Удаление категории</h5>
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    Вы уверены, что хотите удалить категорию "{{ category.name }}"?
                                </div>
                                <div class="modal-footer bg-dark border-secondary">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                                    <form method="post" action="{% url 'products:delete_category' category.id %}">
                                        {% csrf_token %}
                                        <button type="submit" class="btn btn-danger">Удалить</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
            <div class="modal-footer bg-dark border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
            </div>
        </div>
    </div>
</div>
<script>
    function toggleEdit(categoryId) {
        const title = document.getElementById(`category-title-${categoryId}`);
        const form = document.getElementById(`category-edit-form-${categoryId}`);

        if (title.classList.contains('d-none')) {
            title.classList.remove('d-none');
            form.classList.add('d-none');
        } else {
            title.classList.add('d-none');
            form.classList.remove('d-none');
            form.querySelector('input').focus();
        }
    }
</script>
