{% extends 'base.html' %}
{% load static %}

{% block title %}Analytics panel{% endblock %}

{% block style %}
<style>
    .stat-card {
        transition: transform 0.3s;
        border-radius: 10px;
        overflow: hidden;
        border: none;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .stat-card:hover {
        transform: translateY(-5px);
    }
    .card-icon {
        font-size: 2.5rem;
        margin-bottom: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="mb-4 text-center">Analytics panel</h1>

    <div class="row justify-content-center">
        <div class="col-md-4 mb-4">
            <a href="{% url 'products:summary_product_activity' %}" class="text-decoration-none">
                <div class="card stat-card h-100 text-center py-4 bg-primary text-white">
                    <div class="card-body">
                        <div class="card-icon">
                            <i class="bi bi-box-seam"></i>
                        </div>
                        <h3 class="card-title">Product activity</h3>
                        <p class="card-text">Motion product Analysis </p>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-4 mb-4">
            <a href="{% url 'products:summary_supplier' %}" class="text-decoration-none">
                <div class="card stat-card h-100 text-center py-4 bg-success text-white">
                    <div class="card-body">
                        <div class="card-icon">
                            <i class="bi bi-truck"></i>
                        </div>
                        <h3 class="card-title">Suppliers</h3>
                        <p class="card-text">Product statistic from suppliers</p>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
